<div class="booking-form">
  <h2>New Booking</h2>

  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="success" class="success">{{ success }}</div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label>Customer Name</label>
        <input [(ngModel)]="booking.customerName" name="customerName" required placeholder="John Smith" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input [(ngModel)]="booking.customerEmail" name="customerEmail" type="email" required placeholder="john@example.com" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Destination</label>
        <input [(ngModel)]="booking.destination" name="destination" required placeholder="Dubai" />
      </div>
      <div class="form-group">
        <label>Total Price ($)</label>
        <input [(ngModel)]="booking.totalPrice" name="totalPrice" type="number" required min="0" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Departure Date</label>
        <input [(ngModel)]="booking.departureDate" name="departureDate" type="date" required />
      </div>
      <div class="form-group">
        <label>Return Date</label>
        <input [(ngModel)]="booking.returnDate" name="returnDate" type="date" required />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Passengers</label>
        <input [(ngModel)]="booking.passengers" name="passengers" type="number" required min="1" max="20" />
      </div>
      <div class="form-group">
        <label>Notes (optional)</label>
        <input [(ngModel)]="booking.notes" name="notes" placeholder="Any special requests" />
      </div>
    </div>
    <button type="submit" [disabled]="submitting" class="btn-submit">
      {{ submitting ? 'Creating...' : 'Create Booking' }}
    </button>
  </form>
</div>
